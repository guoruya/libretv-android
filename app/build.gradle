plugins { id 'com.android.application' }

android {
    namespace 'app.libretv.android'
    compileSdk 36
    defaultConfig {
        applicationId 'app.libretv.android'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.3.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            personal {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.personal
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
